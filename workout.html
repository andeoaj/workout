<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Workout Tracker</title>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #F0F2F5;
  --surface: #FFFFFF;
  --surface2: #F8F9FA;
  --accent: #0066FF;
  --accent2: #FF4500;
  --text: #111827;
  --text2: #6B7280;
  --success: #10B981;
  --border: #E5E7EB;
  --radius: 12px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}
/* ── AUTH GATE ── */
#auth-gate {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; z-index: 99999;
}
#auth-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px 32px;
  display: flex; flex-direction: column; align-items: center; gap: 20px; width: 320px;
}
#auth-title { font-size: 1.4rem; font-weight: 700; color: var(--text); }
#auth-sub   { font-size: 0.85rem; color: var(--text2); text-align: center; line-height: 1.5; }
#google-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 12px 16px; border-radius: 8px;
  background: white; border: none; cursor: pointer;
  font-size: 14px; font-weight: 600; color: #333; transition: opacity 0.2s;
}
#google-btn:hover { opacity: 0.9; }
#google-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#auth-error { color: var(--accent2); font-size: 0.8rem; min-height: 16px; }
/* ── LOADING ── */
#auth-loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--text2); font-size: 14px; z-index: 99998;
}
/* ── NAV ── */
nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
}
nav button {
  flex: 1;
  background: none;
  border: none;
  color: var(--text2);
  padding: 10px 4px 12px;
  font-size: 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: color 0.2s;
}
nav button.active { color: var(--accent); }
nav button svg { width: 22px; height: 22px; }
/* ── HEADER ── */
header {
  padding: 20px 16px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-inner { display: flex; justify-content: space-between; align-items: flex-start; }
header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
header p { font-size: 13px; color: var(--text2); margin-top: 2px; }
#signout-btn {
  background: none; border: 1px solid var(--border); color: var(--text2);
  padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;
  transition: color 0.2s, border-color 0.2s; white-space: nowrap; margin-top: 2px;
}
#signout-btn:hover { color: var(--text); border-color: var(--text2); }
.unit-toggle {
  display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  margin-top: 2px;
}
.unit-toggle button {
  background: none; border: none; padding: 5px 9px; font-size: 11px; font-weight: 600;
  cursor: pointer; color: var(--text2); transition: all 0.15s;
}
.unit-toggle button.active { background: var(--accent); color: #fff; }
/* ── PAGES ── */
.page { display: none; padding: 16px; }
.page.active { display: block; }
/* ── CARDS ── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.card-title {
  font-size: 11px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;
}
/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 18px; border-radius: var(--radius-sm);
  border: none; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary  { background: var(--accent); color: white; }
.btn-secondary{ background: var(--surface2); color: var(--text); }
.btn-success  { background: #22c55e; color: white; }
.btn-sm   { padding: 6px 12px; font-size: 12px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* ── WORKOUT TYPE GRID ── */
.workout-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 16px; }
.workout-btn {
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 16px 8px; text-align: center;
  cursor: pointer; transition: all 0.2s;
}
.workout-btn:hover, .workout-btn.selected {
  border-color: var(--accent); background: rgba(0,102,255,0.1);
}
.workout-btn .letter { font-size: 28px; font-weight: 800; color: var(--accent); display: block; }
.workout-btn .label  { font-size: 10px; color: var(--text2); margin-top: 4px; line-height: 1.3; }
/* ── EXERCISE BLOCK ── */
.exercise-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.exercise-header { padding: 12px 16px; background: var(--surface2); }
.exercise-name  { font-size: 15px; font-weight: 600; }
.exercise-notes { font-size: 11px; color: var(--text2); margin-top: 3px; font-style: italic; }
.exercise-body  { padding: 12px 16px; }
/* ── SET ROW ── */
.set-row { display: grid; grid-template-columns: 32px 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; border-left: 2px solid transparent; padding-left: 4px; border-radius: 4px; transition: border-color 0.2s, background 0.2s; }
.set-row.prefilled { border-left-color: var(--border); }
.set-row.changed   { border-left-color: var(--success); background: rgba(74,222,128,0.07); }
.set-num  { font-size: 12px; color: var(--text2); font-weight: 600; text-align: center; }
.st-label { font-size: 9px; font-weight: 700; color: var(--accent2); text-align: center; line-height: 1; }
.prefill-label { font-size: 11px; color: var(--text2); margin-bottom: 8px; font-style: italic; }
/* ── INPUTS ── */
input[type="number"], input[type="text"], input[type="date"], textarea, select {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  padding: 8px 10px; font-size: 14px; width: 100%;
  outline: none; transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input::placeholder { color: var(--text2); }
.delete-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 18px; line-height: 1; }
.delete-btn:hover { color: #ef4444; }
/* ── CHARTS ── */
.chart-container { position: relative; height: 240px; margin-top: 12px; }
/* ── STATS ROW ── */
.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 8px; text-align: center; }
.stat-value { font-size: 22px; font-weight: 800; color: var(--accent); }
.stat-label { font-size: 10px; color: var(--text2); margin-top: 3px; }
/* ── HISTORY ITEMS ── */
.history-item { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
/* ── FORM ── */
.form-group { margin-bottom: 12px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--text2); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
/* ── TOAST ── */
.toast {
  position: fixed; bottom: 88px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--success); color: #000;
  padding: 10px 20px; border-radius: 20px;
  font-size: 14px; font-weight: 600; opacity: 0;
  transition: all 0.3s; z-index: 200; white-space: nowrap; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* ── BADGES ── */
.badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
.badge-A1 { background: #3b82f6; color: white; }
.badge-B2 { background: #10b981; color: white; }
.badge-A2 { background: #f59e0b; color: white; }
.badge-B1 { background: #8b5cf6; color: white; }
/* ── TYPOGRAPHY ── */
.section-title { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
.section-sub   { font-size: 13px; color: var(--text2); margin-bottom: 14px; }
/* ── TABS ── */
.tab-row { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
.tab-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--text2); padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.tab-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
/* ── MISC ── */
.add-set-area { display: flex; gap: 8px; margin-top: 8px; }
.empty-state { text-align: center; padding: 36px 20px; color: var(--text2); }
.empty-state .emoji { font-size: 44px; margin-bottom: 10px; }
.empty-state p { font-size: 14px; line-height: 1.5; }
.prev-perf { font-size: 11px; color: var(--text2); margin-bottom: 8px; padding: 6px 8px; background: var(--surface2); border-radius: var(--radius-sm); line-height: 1.6; }
.prev-perf strong { color: var(--text); }
.import-textarea { font-family: monospace; font-size: 12px; min-height: 180px; resize: vertical; }
.parsed-ex { padding: 8px 10px; background: var(--surface2); border-radius: 6px; margin-bottom: 4px; font-size: 13px; }
@media (min-width: 600px) { body { max-width: 600px; margin: 0 auto; } }
</style>
</head>
<body>

<!-- Auth gate -->
<div id="auth-gate" style="display:none;">
  <div id="auth-box">
    <div id="auth-title">Workout Tracker</div>
    <div id="auth-sub">Sign in to sync your workouts across all your devices</div>
    <button id="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
      </svg>
      Continue with Google

</div>

<!-- Loading -->
<div id="auth-loading">Loading…</div>

<!-- App -->
<div id="app" style="display:none;">

<header>
  <div class="header-inner">
    <div>
      <h1 id="page-title">Dashboard</h1>
      <p id="page-sub">Your workout overview</p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">

<div id="page-home"     class="page active"></div>

<nav>
  <button id="nav-home"     class="active" onclick="navigate('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home

<script>
// ════════════════════════════════════════════════════
// FIREBASE INIT
// ════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyBfwjA7lURUdoEGjvFPQ-uT_UzWgIMA5Ng",
  authDomain:        "workout-planner-511a6.firebaseapp.com",
  projectId:         "workout-planner-511a6",
  storageBucket:     "workout-planner-511a6.firebasestorage.app",
  messagingSenderId: "336052618000",
  appId:             "1:336052618000:web:f982eb4b54379aad671b95",
  measurementId:     "G-PJYQXPTGP9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ════════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════════
function signInWithGoogle() {
  const btn = document.getElementById('google-btn');
  const errEl = document.getElementById('auth-error');
  btn.disabled = true;
  errEl.textContent = '';
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    if (err.code === 'auth/popup-blocked') {
      errEl.textContent = 'Popup was blocked. Please allow popups for this site in your browser settings, then try again.';
    } else if (err.code !== 'auth/popup-closed-by-user') {
      errEl.textContent = err.message + ' (' + err.code + ')';
    }
    btn.disabled = false;
  });
}

function signOut() {
  auth.signOut();
}

auth.onAuthStateChanged(async user => {
  const loading   = document.getElementById('auth-loading');
  const authGate  = document.getElementById('auth-gate');
  const app       = document.getElementById('app');

  if (user) {
    _uid = user.uid;
    await loadUserData();
    await checkMigration();
    loading.style.display  = 'none';
    authGate.style.display = 'none';
    app.style.display      = 'block';
    document.getElementById('unit-kg').classList.toggle('active', unitPref === 'kg');
    document.getElementById('unit-lbs').classList.toggle('active', unitPref === 'lbs');
    renderHome();
  } else {
    _uid = null;
    _userData = { sessions: [], bodyWeights: [], programs: null };
    loading.style.display  = 'none';
    authGate.style.display = 'flex';
    app.style.display      = 'none';
  }
});

// ════════════════════════════════════════════════════
// FIRESTORE DATA LAYER
// ════════════════════════════════════════════════════
let _uid      = null;
let _userData = { sessions: [], bodyWeights: [], programs: null };

async function loadUserData() {
  const doc = await db.collection('users').doc(_uid).get();
  if (doc.exists) {
    const d = doc.data();
    _userData.sessions    = d.sessions    || [];
    _userData.bodyWeights = d.bodyWeights || [];
    _userData.programs    = d.programs    || null;
  } else {
    _userData = { sessions: [], bodyWeights: [], programs: null };
  }
}

async function _saveUserData() {
  try {
    await db.collection('users').doc(_uid).set(_userData);
  } catch (e) {
    showToast('Save failed — check connection', false);
    console.error(e);
  }
}

// Auto-migrate localStorage data on first sign-in
async function checkMigration() {
  if (_userData.sessions.length > 0 || _userData.bodyWeights.length > 0) return;
  const lsSessions    = JSON.parse(localStorage.getItem('wt_sessions')    || '[]');
  const lsBW          = JSON.parse(localStorage.getItem('wt_bodyweights') || '[]');
  const lsPrograms    = JSON.parse(localStorage.getItem('wt_programs')    || 'null');
  if (!lsSessions.length && !lsBW.length && !lsPrograms) return;
  if (lsSessions.length) _userData.sessions    = lsSessions;
  if (lsBW.length)       _userData.bodyWeights = lsBW;
  if (lsPrograms)        _userData.programs    = lsPrograms;
  await _saveUserData();
  showToast('Local data migrated to cloud ✓');
}

// DB — synchronous reads (from cache), async writes
const DB = {
  getPrograms()            { return _userData.programs || JSON.parse(JSON.stringify(DEFAULT_PROGRAMS)); },
  async savePrograms(p)    { _userData.programs = p;    await _saveUserData(); },
  getSessions()            { return _userData.sessions    || []; },
  async saveSessions(s)    { _userData.sessions = s;    await _saveUserData(); },
  getBodyWeights()         { return _userData.bodyWeights || []; },
  async saveBodyWeights(bw){ _userData.bodyWeights = bw; await _saveUserData(); },
};

// ════════════════════════════════════════════════════
// DEFAULT PROGRAM
// ════════════════════════════════════════════════════
const DEFAULT_PROGRAMS = {
  A1: {
    name: "Cosce & Pettorali", nameEn: "Legs & Chest (FM+FRes)",
    exercises: [
      { id:'a11', name:'Squat',              notes:'3×2 fermo giù TUT32X1 @60/65/70kg + 3×6 normali' },
      { id:'a12', name:'RDL',               notes:'4×8' },
      { id:'a13', name:'Panca piana',        notes:'3×3 fermo giù TUT32X1 @55/60/65kg + 3×6' },
      { id:'a14', name:'Dips con ascensore', notes:'4×8' },
    ]
  },
  B2: {
    name: "Dorsali / Deltoidi / Bicipiti", nameEn: "Back / Shoulders / Biceps (LT+)",
    exercises: [
      { id:'b21', name:'Chinups presa supina',        notes:'3×(5+5) CS20"' },
      { id:'b22', name:'Shoulder press presa larga',  notes:'4×8/12' },
      { id:'b23', name:'Curl bil corto medio zigrinatura', notes:'3×8/12' },
      { id:'b24', name:'Pulley con trazybar',         notes:'3×10/15 — ultima ST' },
      { id:'b25', name:'Alzate laterali cavo basso',  notes:'3×10/15 — ultima ST' },
      { id:'b26', name:'Curl elastico a martello',    notes:'3×10/15' },
    ]
  },
  A2: {
    name: "Pettorali / Cosce / Tricipiti", nameEn: "Chest / Legs / Triceps (LT+)",
    exercises: [
      { id:'a21', name:'Panca inclinata bil',     notes:'3×(5+5) CS20"' },
      { id:'a22', name:'Leg press orizzontale',   notes:'4×8/12' },
      { id:'a23', name:'French press bil.EZ',     notes:'4×8/12' },
      { id:'a24', name:'Croci cavi alti',         notes:'3×10/15 — ultima ST' },
      { id:'a25', name:'Leg extension',           notes:'3×10/15 — ultima ST' },
      { id:'a26', name:'Pushdown elastico',       notes:'3×10/15' },
    ]
  },
  B1: {
    name: "Dorsali & Deltoidi", nameEn: "Back & Shoulders (FM+FRes)",
    exercises: [
      { id:'b11', name:'Pullups presa media',              notes:'3×3 fermo su TUT32X2 @-25kg + 3×6' },
      { id:'b12', name:'Rematore bil',                     notes:'4×8' },
      { id:'b13', name:'Spinte manubri panca 75°',         notes:'3×3 fermo su TUT32X2 @18kg + 3×6' },
      { id:'b14', name:'Tirate al mento sbarra cavo basso', notes:'4×8' },
    ]
  }
};

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let logState  = { type: null, date: todayStr(), sets: {}, id: null };
let progState = { type: 'A1', exerciseId: null, metric: 'weight' };
const charts  = {};

// ════════════════════════════════════════════════════
// UNIT PREFERENCE
// ════════════════════════════════════════════════════
let unitPref = localStorage.getItem('wt_unit') || 'kg';

function toDisplay(kg) {
  if (kg === '' || kg === null || kg === undefined) return '';
  return unitPref === 'lbs' ? Math.round(kg * 2.20462 * 10) / 10 : kg;
}
function fromDisplay(val) {
  if (val === '' || val === null || isNaN(val)) return '';
  return unitPref === 'lbs' ? Math.round((val / 2.20462) * 100) / 100 : parseFloat(val);
}
function unitLabel() { return unitPref; }

function setUnit(u) {
  unitPref = u;
  localStorage.setItem('wt_unit', u);
  document.getElementById('unit-kg').classList.toggle('active', u === 'kg');
  document.getElementById('unit-lbs').classList.toggle('active', u === 'lbs');
  logState.sets = {};
  renderLog();
  renderProgress();
  renderBody();
}

// ════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════
function todayStr()   { return new Date().toISOString().split('T')[0]; }
function uid()        { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmtDate(ds)  { return new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'}); }
function daysSince(ds){
  const d = Math.floor((Date.now() - new Date(ds+'T12:00:00')) / 86400000);
  return d === 0 ? 'Today' : d === 1 ? '1 day' : d + ' days';
}
function showToast(msg, ok=true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = ok ? 'var(--success)' : '#ef4444';
  el.style.color = ok ? '#000' : '#fff';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

const PAGE_META = {
  home:     ['Dashboard',    'Your workout overview'],
  log:      ['Log Workout',  'Record a session'],
  progress: ['Progress',     'Weight load over time'],
  body:     ['Body Weight',  'Track your weight'],
  import:   ['Import Notes', 'Update workout program'],
};

function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('nav-'  + page).classList.add('active');
  const [t, s] = PAGE_META[page];
  document.getElementById('page-title').textContent = t;
  document.getElementById('page-sub').textContent   = s;
  if (page === 'home')     renderHome();
  if (page === 'log')      renderLog();
  if (page === 'progress') renderProgress();
  if (page === 'body')     renderBody();
  if (page === 'import')   renderImport();
}

      <div class="stat-card"><div class="stat-value">${lastBW ? lastBW.weight+' kg' : '—'}</div><div class="stat-label">Last Weight</div></div>
      <div class="stat-card"><div class="stat-value">${recent.length ? daysSince(recent[0].date) : '—'}</div><div class="stat-label">Since Last</div></div>
    </div>

    <div class="card">
      <div class="card-title">Quick Start</div>
      <div class="workout-grid">
        ${['A1','B2','A2','B1'].map(t=>`
          <div class="workout-btn" onclick="startWorkout('${t}')">
            <span class="letter">${t}</span>
            <span class="label">${TN[t]}</span>

    <div class="card">
      <div class="card-title">Recent Sessions</div>
      ${recent.length === 0
        ? `<div class="empty-state"><div class="emoji">🏋️</div><p>No sessions yet.<br>Tap a workout above to start!</p></div>`
        : recent.map(s=>`
          <div class="history-item">

              <div style="font-weight:600;font-size:14px">${fmtDate(s.date)}</div>

function startWorkout(type) {
  logState = { type, date: todayStr(), sets: {}, id: null };
  navigate('log');
}

function editSession(id) {
  const session = DB.getSessions().find(s => s.id === id);
  if (!session) return;
  const sets = {};
  session.exercises.forEach(ex => {
    sets[ex.exerciseId] = ex.sets.map(s => ({ ...s }));
  });
  logState = { id: session.id, type: session.type, date: session.date, sets };
  navigate('log');
}

// ════════════════════════════════════════════════════
// LOG
// ════════════════════════════════════════════════════
function renderLog() {
  const programs = DB.getPrograms();
  const TN = { A1:'Cosce & Pettorali', B2:'Dorsali/Delt/Bic', A2:'Pett/Cosce/Tric', B1:'Dorsali & Deltoidi' };

  let html = `
    <div class="card">
      <div class="card-title">Select Workout</div>
      <div class="workout-grid">
        ${['A1','B2','A2','B1'].map(t=>`
          <div class="workout-btn ${logState.type===t?'selected':''}" onclick="selectType('${t}')">
            <span class="letter">${t}</span>
            <span class="label">${TN[t]}</span>
          </div>`).join('')}
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" value="${logState.date}" onchange="logState.date=this.value">
      </div>
    </div>`;

  if (logState.type) {
    const prog = programs[logState.type];
    if (!prog) { logState.type = null; renderLog(); return; }
    const sessions = DB.getSessions();
    const lastSess = [...sessions].filter(s=>s.type===logState.type).sort((a,b)=>b.date.localeCompare(a.date))[0];

    html += `<div class="section-title">${prog.name}</div>
             <div class="section-sub">Add sets per exercise. Use + ST Set for stripping (drop) sets.</div>`;

    prog.exercises.forEach(ex => {
      const lastExData = lastSess?.exercises.find(e=>e.exerciseId===ex.id);
      if (!logState.sets[ex.id]) {
        logState.sets[ex.id] = lastExData?.sets?.length
          ? lastExData.sets.map(s => ({ weight: s.weight??'', reps: s.reps??'', isStripping: s.isStripping, _prefilled: true }))
          : [];
      }
      html += buildExBlock(ex, lastSess?.date);
    });

    html += `<button class="btn btn-success btn-full" onclick="saveSession()" style="margin-top:4px;margin-bottom:20px">
               ${logState.id ? '✓ Update Session' : '✓ Save Session'}
             </button>`;
  }

  document.getElementById('page-log').innerHTML = html;
}

function buildExBlock(ex, lastDate) {
  const sets = logState.sets[ex.id] || [];

  const prefillLabel = lastDate && sets.some(s => s._prefilled)
    ? `<div class="prefill-label">↑ Pre-filled from ${fmtDate(lastDate)} — edit to update</div>`
    : '';

  const setsHtml = sets.map((s,i) => {
    const rowClass = s._changed ? 'set-row changed' : (s._prefilled ? 'set-row prefilled' : 'set-row');
    return `
    <div class="${rowClass}" id="sr-${ex.id}-${i}">
      <div>
        <div class="set-num">${i+1}</div>
        ${s.isStripping ? '<div class="st-label">ST</div>' : ''}
      </div>
      <input type="number" step="0.5" min="0" placeholder="${unitLabel()}"
        value="${toDisplay(s.weight)}" style="text-align:center"
        oninput="updSet('${ex.id}',${i},'weight',this.value)">
      <input type="number" min="0" placeholder="reps"
        value="${s.reps??''}" style="text-align:center"
        oninput="updSet('${ex.id}',${i},'reps',this.value)">
      <button class="delete-btn" onclick="removeSet('${ex.id}',${i})">×</button>
    </div>`;
  }).join('');

  return `
    <div class="exercise-block" id="exb-${ex.id}">
      <div class="exercise-header">
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-notes">${ex.notes}</div>
      </div>
      <div class="exercise-body">
        ${prefillLabel}
        ${setsHtml}
        <div class="add-set-area">
          <button class="btn btn-secondary btn-sm" style="flex:1" onclick="addSet('${ex.id}',false)">+ Set</button>
          <button class="btn btn-sm" style="flex:1;background:rgba(255,69,0,0.1);color:var(--accent2)" onclick="addSet('${ex.id}',true)">+ ST Set</button>
        </div>
      </div>
    </div>`;
}

function selectType(t) { logState.type = t; logState.sets = {}; renderLog(); }

function addSet(exId, isStripping) {
  if (!logState.sets[exId]) logState.sets[exId] = [];
  logState.sets[exId].push({ weight:'', reps:'', isStripping });
  renderLog();
  setTimeout(() => document.getElementById('exb-'+exId)?.scrollIntoView({behavior:'smooth',block:'nearest'}), 60);
}

function removeSet(exId, idx) { logState.sets[exId].splice(idx,1); renderLog(); }

function updSet(exId, idx, field, val) {
  if (!logState.sets[exId]) return;
  logState.sets[exId][idx][field] = field === 'weight' ? fromDisplay(parseFloat(val)) : (val === '' ? '' : parseFloat(val));
  logState.sets[exId][idx]._changed = true;
  const row = document.getElementById('sr-' + exId + '-' + idx);
  if (row) { row.classList.remove('prefilled'); row.classList.add('changed'); }
}

async function saveSession() {
  if (!logState.type) { showToast('Choose a workout type first', false); return; }
  const prog = DB.getPrograms()[logState.type];
  if (!prog) { showToast('Program not found — try reloading', false); return; }
  const exLogs = prog.exercises
    .filter(ex => (logState.sets[ex.id]||[]).length > 0)
    .map(ex => ({
      exerciseId:   ex.id,
      exerciseName: ex.name,
      sets: logState.sets[ex.id].map(s => ({
        weight:      s.weight==='' ? null : parseFloat(s.weight),
        reps:        s.reps===''   ? null : parseInt(s.reps),
        isStripping: s.isStripping
      }))
    }));

  if (!exLogs.length) { showToast('Add at least one set!', false); return; }

  let sessions = DB.getSessions();
  if (logState.id) {
    sessions = sessions.map(s => s.id === logState.id
      ? { ...s, date: logState.date, type: logState.type, exercises: exLogs }
      : s);
    await DB.saveSessions(sessions);
    logState = { type: null, date: todayStr(), sets: {}, id: null };
    showToast('Session updated! ✓');
  } else {
    sessions.push({ id: uid(), date: logState.date, type: logState.type, exercises: exLogs });
    await DB.saveSessions(sessions);
    logState = { type: null, date: todayStr(), sets: {}, id: null };
    showToast('Session saved! 💪');
  }
  setTimeout(() => navigate('home'), 900);
}

// PROGRESS

function renderProgress() {
  const programs = DB.getPrograms();
  const TN = { A1:'Cosce & Pettorali', B2:'Dorsali/Delt/Bic', A2:'Pett/Cosce/Tric', B1:'Dorsali & Deltoidi' };
  if (!progState.exerciseId) progState.exerciseId = programs[progState.type]?.exercises[0]?.id || null;

  const exercises  = programs[progState.type]?.exercises || [];
  const sessions   = DB.getSessions();
  const exSessions = sessions
    .filter(s => s.type===progState.type && s.exercises.some(e=>e.exerciseId===progState.exerciseId))
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0,30);

  document.getElementById('page-progress').innerHTML = `
    <div class="tab-row">
      ${['A1','B2','A2','B1'].map(t=>`<button class="tab-btn ${progState.type===t?'active':''}" onclick="setPType('${t}')">${t} · ${TN[t]}</button>`).join('')}
    </div>

    <div class="form-group">
      <label class="form-label">Exercise</label>
      <select onchange="setPEx(this.value)">
        ${exercises.map(ex=>`<option value="${ex.id}" ${progState.exerciseId===ex.id?'selected':''}>${ex.name}</option>`).join('')}
      </select>
    </div>

    <div class="tab-row">
      <button class="tab-btn ${progState.metric==='weight'?'active':''}" onclick="setPMetric('weight')">Max Weight</button>
      <button class="tab-btn ${progState.metric==='volume'?'active':''}" onclick="setPMetric('volume')">Total Volume</button>
    </div>

    <div class="card">
      <div class="card-title">${progState.metric==='weight' ? 'Max working weight (kg)' : 'Total volume (kg × reps)'}</div>
      <div class="chart-container"><canvas id="prog-chart"></canvas></div>
    </div>

    ${exSessions.length===0
      ? `<div class="empty-state"><div class="emoji">📈</div><p>No data yet for this exercise.<br>Log a session to see your progress!</p></div>`
      : `<div class="card">
          <div class="card-title">Session History</div>
          ${exSessions.map(s => {
            const ed = s.exercises.find(e=>e.exerciseId===progState.exerciseId);
            if (!ed) return '';
            const row = ed.sets.map(st => {
              const w = st.weight!==null ? st.weight+'kg' : 'BW';
              return `${w}×${st.reps}${st.isStripping?'<span style="color:var(--accent2)"> ST</span>':''}`;
            }).join(' · ');
            return `<div class="history-item" style="flex-direction:column;align-items:flex-start;gap:4px">
              <strong style="font-size:13px">${fmtDate(s.date)}</strong>
              <span style="font-size:12px;color:var(--text2)">${row}</span>
            </div>`;
          }).join('')}
         </div>`
    }`;

  drawProgressChart();
}

function drawProgressChart() {
  const exId   = progState.exerciseId;
  const type   = progState.type;
  const metric = progState.metric;
  const pts = DB.getSessions()
    .filter(s => s.type===type && s.exercises.some(e=>e.exerciseId===exId))
    .sort((a,b) => a.date.localeCompare(b.date))
    .map(s => {
      const ed = s.exercises.find(e=>e.exerciseId===exId);
      if (!ed) return null;
      const valid = ed.sets.filter(st => st.weight!==null && st.reps!==null && st.weight!=='' && st.reps!=='');
      if (!valid.length) return null;
      const val = metric==='weight'
        ? toDisplay(Math.max(...valid.map(st=>st.weight)))
        : toDisplay(valid.reduce((a,st)=>a+(st.weight*st.reps),0));
      return { label: fmtDate(s.date), val };
    }).filter(Boolean);

  const canvas = document.getElementById('prog-chart');
  if (!canvas) return;
  if (charts.prog) charts.prog.destroy();
  charts.prog = new Chart(canvas, {
    type: 'line',
    data: {
      labels: pts.map(p=>p.label),
      datasets: [{
        data: pts.map(p=>p.val),
        borderColor: '#0066FF', backgroundColor: 'rgba(0,102,255,0.1)',
        borderWidth: 2.5, pointBackgroundColor: '#6c63ff',
        pointRadius: 5, pointHoverRadius: 7, tension: 0.3, fill: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor:'#1a1a24', borderColor:'#6c63ff', borderWidth:1,
          titleColor:'#e8e8f0', bodyColor:'#8888a8',
          callbacks: { label: ctx=>` ${ctx.parsed.y}${metric==='weight'?' '+unitLabel():' '+unitLabel()+'·reps'}` }
        }
      },
      scales: {
        x: { grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#8888a8',font:{size:11}} },
        y: { grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#8888a8',font:{size:11}}, beginAtZero:false }
      }
    }
  });
}

function setPType(t)    { progState.type=t; progState.exerciseId=DB.getPrograms()[t]?.exercises[0]?.id||null; renderProgress(); }
function setPEx(id)     { progState.exerciseId=id; renderProgress(); }
function setPMetric(m)  { progState.metric=m; renderProgress(); }

function renderBody() {
  const bws = DB.getBodyWeights().sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById('page-body').innerHTML = `
    <div class="card">
      <div class="card-title">Log Body Weight</div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" id="bw-date" value="${todayStr()}">
      </div>
      <div class="form-group">
        <label class="form-label">Weight (${unitLabel()})</label>
        <input type="number" id="bw-val" step="0.1" min="0" placeholder="${unitLabel() === 'lbs' ? 'e.g. 173' : 'e.g. 78.5'}">
      </div>
      <button class="btn btn-primary btn-full" onclick="saveBW()">Save</button>
    </div>

    <div class="card">
      <div class="card-title">Weight over time</div>
      <div class="chart-container"><canvas id="bw-chart"></canvas></div>
    </div>

    ${bws.length ? `
    <div class="card">
      <div class="card-title">History</div>
      ${bws.slice(0,25).map(b=>`
        <div class="history-item">
          <span style="font-size:14px">${fmtDate(b.date)}</span>
          <div style="display:flex;align-items:center;gap:10px">
            <strong>${toDisplay(b.weight)} ${unitLabel()}</strong>
            <button class="delete-btn" onclick="deleteBW('${b.id}')" style="font-size:16px">×</button>
          </div>
        </div>`).join('')}
    </div>` : ''}`;

  drawBWChart(bws);
}

async function saveBW() {
  const date   = document.getElementById('bw-date').value;
  const rawVal = parseFloat(document.getElementById('bw-val').value);
  const weight = fromDisplay(rawVal);
  if (!date || isNaN(weight) || weight <= 0) { showToast('Enter a valid weight', false); return; }
  const bws = DB.getBodyWeights();
  bws.push({ id: uid(), date, weight });
  await DB.saveBodyWeights(bws);
  showToast('Logged!');
  renderBody();
}

async function deleteBW(id) {
  await DB.saveBodyWeights(DB.getBodyWeights().filter(b=>b.id!==id));
  renderBody();
}

function drawBWChart(bws) {
  const canvas = document.getElementById('bw-chart');
  if (!canvas) return;
  const sorted = [...bws].sort((a,b)=>a.date.localeCompare(b.date));
  if (charts.bw) charts.bw.destroy();
  charts.bw = new Chart(canvas, {
    type: 'line',
    data: {
      labels: sorted.map(b=>fmtDate(b.date)),
      datasets: [{
        data: sorted.map(b=>toDisplay(b.weight)),
        borderColor:'#FF4500', backgroundColor:'rgba(255,69,0,0.1)',
        borderWidth:2.5, pointBackgroundColor:'#ff6584',
        pointRadius:5, pointHoverRadius:7, tension:0.3, fill:true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor:'#1a1a24', borderColor:'#ff6584', borderWidth:1,
          titleColor:'#e8e8f0', bodyColor:'#8888a8',
          callbacks: { label: ctx=>` ${ctx.parsed.y} ${unitLabel()}` }
        }
      },
      scales: {
        x: { grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#8888a8',font:{size:11}} },
        y: { grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#8888a8',font:{size:11}}, beginAtZero:false }
      }
    }
  });
}

function runParser() {
  const text = document.getElementById('import-text').value;
  if (!text.trim()) { showToast('Paste some text first', false); return; }
  const parsed = parseWorkoutText(text);
  const total  = Object.values(parsed).reduce((n,v)=>n+v.exercises.length, 0);
  const preview = document.getElementById('import-preview');

  if (!total) {
    preview.innerHTML = `<div class="card" style="border-color:#ef4444;color:#ef4444">
      Could not find exercises. Make sure the text contains section headers like
      <code>A- Cosce, bicipiti</code> followed by exercise names.</div>`;
    return;
  }

  const TN = { A1:'Cosce & Pettorali', B2:'Dorsali/Delt/Bic', A2:'Pett/Cosce/Tric', B1:'Dorsali & Deltoidi' };
  let html = `<div class="card">
    <div class="card-title">Preview — ${total} exercises found</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Confirm to replace the exercise list for the sections shown below.</p>`;

  ['A1','B2','A2','B1'].forEach(t => {
    const list = parsed[t]?.exercises||[];
    if (!list.length) return;
    html += `<div style="margin-bottom:14px">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px">${t} · ${TN[t]}</div>
      ${list.map((ex,i)=>`
        <div class="parsed-ex">
          <strong>${i+1}. ${ex.name}</strong>
          ${ex.notes?`<div style="font-size:11px;color:var(--text2);margin-top:2px">${ex.notes}</div>`:''}
        </div>`).join('')}
    </div>`;
  });

  html += `<button class="btn btn-success btn-full" onclick="applyParsed()" style="margin-top:4px">✓ Apply Update</button></div>`;
  preview.innerHTML = html;
  preview._parsed   = parsed;
  preview.scrollIntoView({ behavior:'smooth' });
}

function parseWorkoutText(text) {
  const result = { A1:{exercises:[]}, B2:{exercises:[]}, A2:{exercises:[]}, B1:{exercises:[]} };
  const lines  = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const TYPE_RE = /^([AB][12])[-–\s]/;
  const SKIP_RE = /^(--|MACRO|MESO|MICRO|WARMUP|Mobilita|Warm)/i;

  let cur = null;
  for (const line of lines) {
    const tm = line.match(TYPE_RE);
    if (tm && result[tm[1]] !== undefined) { cur = tm[1]; continue; }
    if (!cur || SKIP_RE.test(line) || line.startsWith('-')) continue;
    if (!/^[A-Z\u00C0-\u00FF]/.test(line)) continue;

    let name = line
      .replace(/\d+[×x]\d+\/?\d*[^@]*/i, '')
      .replace(/-\d+\/?\d*["\s]*/g, '')
      .replace(/ultima\s+ST.*/i, '')
      .replace(/@.*/g, '')
      .replace(/\s{2,}/g,' ').trim()
      .replace(/[,\s\-]+$/, '');
    if (name.length < 3) continue;

    const notes = line.length > name.length
      ? line.slice(name.length).replace(/^[\s,\-]+/,'').trim()
      : '';

    const list = result[cur].exercises;
    if (!list.some(e=>e.name.toLowerCase()===name.toLowerCase())) {
      list.push({ id: cur.toLowerCase()+(list.length+1), name, notes });
    }
  }
  return result;
}

async function applyParsed() {
  const preview = document.getElementById('import-preview');
  if (!preview._parsed) return;
  const programs = DB.getPrograms();
  ['A1','B2','A2','B1'].forEach(t => {
    if (preview._parsed[t]?.exercises?.length > 0) programs[t].exercises = preview._parsed[t].exercises;
  });
  await DB.savePrograms(programs);
  showToast('Program updated! ✨');
  setTimeout(() => { document.getElementById('import-text').value=''; document.getElementById('import-preview').innerHTML=''; }, 1500);
}

async function resetProgram() {
  if (!confirm('Reset to default exercise list? Your logged sessions will not be deleted.')) return;
  await DB.savePrograms(JSON.parse(JSON.stringify(DEFAULT_PROGRAMS)));
  showToast('Program reset to default.');
}

// ════════════════════════════════════════════════════
// SESSION IMPORT FROM TRAINER NOTES
// ════════════════════════════════════════════════════
function runSessionParser() {
  const text = document.getElementById('session-import-text').value;
  if (!text.trim()) { showToast('Paste some notes first', false); return; }
  const sessions = parseSessionsText(text);
  const preview  = document.getElementById('session-import-preview');

  if (!sessions.length) {
    preview.innerHTML = `<div class="card" style="border-color:#ef4444;padding:16px;color:#ef4444">
      No sessions found. Make sure the text has a date line (-- DD/M/YY) and a workout type header (A1-, B2-, A2-, or B1-).</div>`;
    return;
  }

  const existing = DB.getSessions();
  const TN = { A1:'Cosce & Pettorali', B2:'Dorsali/Delt/Bic', A2:'Pett/Cosce/Tric', B1:'Dorsali & Deltoidi' };
  let html = '';
  let newCount = 0;

  sessions.forEach(sess => {
    const dup = existing.some(s => s.date === sess.date && s.type === sess.type);
    if (!dup) newCount++;
    html += `<div class="card" style="border-color:${dup ? '#f59e0b' : 'var(--success)'}">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>${sess.type} · ${TN[sess.type]||sess.type} — ${fmtDate(sess.date)}</span>
        <span style="color:${dup ? '#f59e0b' : 'var(--success)'};font-size:10px;font-weight:700">
          ${dup ? '⚠ Already logged' : '✓ New'}
        </span>
      </div>`;
    sess.exercises.forEach(ex => {
      const matched = matchExToProgram(ex.rawName, sess.type);
      html += `<div style="margin-bottom:10px">
        <div style="font-size:13px;font-weight:600;margin-bottom:3px">
          ${matched
            ? matched.name
            : `<span style="color:var(--accent2)">${ex.rawName}
               <span style="font-size:10px;font-weight:400">(no match — saved as-is)</span></span>`}
        </div>
        <div style="font-size:11px;color:var(--text2)">
          ${ex.sets.map((s,i) =>
            `<span>Set ${i+1}: ${s.weight===null?'BW':s.weight+'kg'} × ${s.reps}</span>`
          ).join(' &nbsp;·&nbsp; ')}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<button class="btn btn-success btn-full" onclick="applySessionImport()" style="margin-bottom:20px">
    ✓ Save ${newCount} new session${newCount!==1?'s':''} to History
  </button>`;

  preview.innerHTML  = html;
  preview._sessions  = sessions;
  preview.scrollIntoView({ behavior: 'smooth' });
}

function parseSessionsText(text) {
  const sessions  = [];
  const lines     = text.split('\n');
  let currentDate = null;
  let currentSess = null;
  let currentEx   = null;

  const DATE_RE    = /^--\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/;
  const TYPE_RE    = /^([AB][12])[-–]/;
  const SET_BLOCK  = /^-\s*(\d+)\s*[×x]\s*(\d+)[^@]*@(.+)/;
  const SET_INLINE = /(\d+)\s*[×x]\s*(\d+)[^@]*@(.+)/;

  function stripParens(s) {
    return s.replace(/\([^)]*[a-zA-Z][^)]*\)/g, '').trim();
  }

  function flushEx() {
    if (currentEx && currentEx.sets.length > 0 && currentSess) {
      currentSess.exercises.push({ rawName: currentEx.rawName, sets: currentEx.sets });
    }
    currentEx = null;
  }

  function flushSess() {
    flushEx();
    if (currentSess && currentSess.exercises.length > 0) sessions.push(currentSess);
    currentSess = null;
  }

  for (const raw of lines) {
    const line = raw.trim();
    if (!line || /^MICRO\s/i.test(line)) continue;

    // Date line
    const dm = line.match(DATE_RE);
    if (dm) {
      const yr = +dm[3]; const y = yr < 100 ? 2000 + yr : yr;
      currentDate = `${y}-${String(+dm[2]).padStart(2,'0')}-${String(+dm[1]).padStart(2,'0')}`;
      continue;
    }

    // Workout type header — start new session
    const tm = line.match(TYPE_RE);
    if (tm) {
      flushSess();
      currentSess = { date: currentDate || todayStr(), type: tm[1], exercises: [], id: uid() };
      currentDate = null;
      continue;
    }

    if (!currentSess) continue;

    // Block set line: starts with -, has NxM @weights
    const sbm = line.match(SET_BLOCK);
    if (sbm && currentEx) {
      const wts = parseWeightSeq(stripParens(sbm[3]), +sbm[1]);
      wts.forEach(w => currentEx.sets.push({ weight: w, reps: +sbm[2], isStripping: false }));
      continue;
    }

    // Inline set+name line: has NxM @weights, no leading dash
    const sim = !line.startsWith('-') && line.match(SET_INLINE);
    if (sim) {
      flushEx();
      const nameEnd = line.search(/\d+\s*[×x]\s*\d+/);
      const rawName = (nameEnd > 0 ? line.slice(0, nameEnd) : line)
        .split(',')[0].trim().replace(/\s+/g, ' ');
      if (rawName.length >= 3) {
        const wts = parseWeightSeq(stripParens(sim[3]), +sim[1]);
        currentSess.exercises.push({
          rawName,
          sets: wts.map(w => ({ weight: w, reps: +sim[2], isStripping: false }))
        });
      }
      currentEx = null;
      continue;
    }

    // Exercise name line: starts with letter, no @, not a header
    if (/^[A-Za-zÀ-ÿ]/.test(line) && !line.includes('@') && line.length > 3
        && !/^(MACRO|MESO|WARMUP|Mobilit)/i.test(line)) {
      flushEx();
      const rawName = line.split(',')[0].trim().replace(/\s+/g, ' ');
      if (rawName.length >= 3) currentEx = { rawName, sets: [] };
    }
  }

  flushSess();
  return sessions;
}

function parseWeightSeq(str, numSets) {
  // Split by '-' outside parentheses
  const parts = [];
  let depth = 0, cur = '';
  for (const c of str) {
    if      (c === '(')              { depth++; cur += c; }
    else if (c === ')')              { depth--; cur += c; }
    else if (c === '-' && depth===0) { if (cur.trim()) parts.push(cur.trim()); cur = ''; }
    else                             { cur += c; }
  }
  if (cur.trim()) parts.push(cur.trim());

  let lastW = null;
  const weights = [];
  for (const p of parts) {
    if (/^\/\//.test(p)) {
      weights.push(lastW);
    } else if (/^bw/i.test(p)) {
      weights.push(null); lastW = null;
    } else {
      const m = p.match(/\(?(-?\d+(?:[.,]\d+)?)\)?/);
      if (m) { const w = parseFloat(m[1].replace(',','.')); weights.push(w); lastW = w; }
      else     weights.push(lastW);
    }
  }
  while (weights.length < numSets) weights.push(lastW);
  return weights.slice(0, numSets);
}

function matchExToProgram(rawName, type) {
  const prog = DB.getPrograms()[type];
  if (!prog) return null;
  const norm = s => s.toLowerCase().replace(/[^a-z0-9àèéìòùä°]/g,' ').replace(/\s+/g,' ').trim();
  const nRaw = norm(rawName);
  let best = null, bestScore = 0;
  for (const ex of prog.exercises) {
    const words = norm(ex.name).split(' ').filter(w => w.length > 2);
    const score = words.length ? words.filter(w => nRaw.includes(w)).length / words.length : 0;
    if (score > bestScore && score >= 0.4) { bestScore = score; best = ex; }
  }
  return best;
}

async function applySessionImport() {
  const preview  = document.getElementById('session-import-preview');
  if (!preview._sessions) return;
  const existing = DB.getSessions();
  let added = 0;

  for (const sess of preview._sessions) {
    if (existing.some(s => s.date === sess.date && s.type === sess.type)) continue;
    const exercises = sess.exercises.map(ex => {
      const m = matchExToProgram(ex.rawName, sess.type);
      return {
        exerciseId:   m ? m.id : ex.rawName.toLowerCase().replace(/\s+/g,'-').slice(0,12),
        exerciseName: m ? m.name : ex.rawName,
        sets: ex.sets
      };
    }).filter(ex => ex.sets.length > 0);

    if (exercises.length > 0) {
      existing.push({ id: sess.id || uid(), date: sess.date, type: sess.type, exercises });
      added++;
    }
  }

  await DB.saveSessions(existing);
  showToast(`${added} session${added!==1?'s':''} added to history! 💪`);
  setTimeout(() => {
    document.getElementById('session-import-text').value = '';
    preview.innerHTML = '';
    preview._sessions = null;
  }, 1500);
}
